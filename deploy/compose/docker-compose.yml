# cna: each replica is an `agent-N` container (gateway + Pi + toolchains, ADR-0012). It is only
# on its own `internal-N` network (no internet access); all its outbound traffic goes through
# `edge`, the only piece also on `external` and the only one that publishes a port (8080,
# Bearer-protected API; proxy 3128 is not published). `edge` is on every `internal-N` network.
#
# `agent-1` always starts. `agent-2` and `agent-3` start only with the `replicas` profile:
#   docker compose -f deploy/compose/docker-compose.yml --profile replicas up --build -d
# and then `.env` must list them in CNA_REPLICAS=agent-1,agent-2,agent-3 so that edge knows them.
#
# To add a fourth replica: copy the `agent-3` block with its own network (`internal-4`) and its
# own volume (`agent-4-data`), add `internal-4` to `edge` networks and `agent-4` to CNA_REPLICAS.
#
# Usage:
#   cp deploy/compose/.env.example deploy/compose/.env   # fill in AGENT_API_TOKEN
#   docker compose -f deploy/compose/docker-compose.yml up --build -d
name: cna

x-agent: &agent
  image: cna-agent:local
  build:
    context: ../..
    dockerfile: docker/Dockerfile
  # No `ports`: the agent is only reachable from edge.
  environment:
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    # Referenced as $VARIABLE from notifications.yaml and web.yaml (ADR-0009).
    NTFY_TOKEN: ${NTFY_TOKEN:-}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    BRAVE_API_KEY: ${BRAVE_API_KEY:-}
    TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    CNA_GIT_USER_NAME: ${CNA_GIT_USER_NAME:-}
    CNA_GIT_USER_EMAIL: ${CNA_GIT_USER_EMAIL:-}
    # Minutes of inactivity in `ready` before Pi is stopped to free memory (ADR-0011). 0 = never.
    CNA_IDLE_TIMEOUT_MIN: ${CNA_IDLE_TIMEOUT_MIN:-30}
  # Resource limits (ADR-0011): tests and builds run here, so leave room for the host.
  mem_limit: ${CNA_AGENT_MEM_LIMIT:-6g}
  cpus: ${CNA_AGENT_CPUS:-4}
  pids_limit: ${CNA_AGENT_PIDS_LIMIT:-2048}
  security_opt:
    - "no-new-privileges:true"
  cap_drop:
    - ALL
  restart: unless-stopped
  init: true

services:
  agent-1:
    <<: *agent
    networks:
      - internal-1
    volumes:
      - agent-1-data:/data
      # Read-only: providers.yaml, notifications.yaml and web.yaml (ADR-0008, ADR-0009).
      # Mount the directory, not the files.
      - ../../config:/config:ro

  agent-2:
    <<: *agent
    profiles: [replicas]
    networks:
      - internal-2
    volumes:
      - agent-2-data:/data
      - ../../config:/config:ro

  agent-3:
    <<: *agent
    profiles: [replicas]
    networks:
      - internal-3
    volumes:
      - agent-3-data:/data
      - ../../config:/config:ro

  edge:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.edge
    networks:
      - internal-1
      - internal-2
      - internal-3
      - external
    ports:
      - "${CNA_PUBLISH_ADDR:-127.0.0.1}:8080:8080"
    environment:
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:?set AGENT_API_TOKEN}
      EDGE_ASK_TIMEOUT_MS: ${EDGE_ASK_TIMEOUT_MS:-120000}
      # Replicas edge routes to, comma-separated (ADR-0012). The first one is the default.
      # Must match the `agent-N` services that are up (see CNA_REPLICAS in .env.example).
      EDGE_REPLICAS: ${CNA_REPLICAS:-agent-1}
    volumes:
      - edge-data:/edge-data
      # Read-only: edge reads the allowed provider and service endpoints from here
      # (ADR-0008, ADR-0009).
      - ../../config:/config:ro
    # Linux (Raspberry) needs this for http://host.docker.internal in providers.yaml; Docker
    # Desktop already provides it. Only edge resolves and connects to providers.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - agent-1
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    restart: unless-stopped
    init: true

  # Optional web search for `web_search` (ADR-0009): docker compose --profile search up.
  # Only on `external`: the agent reaches it through edge (web.yaml: http://searxng:8080).
  searxng:
    image: searxng/searxng:2026.10.30-ffa88e3ba
    profiles: [search]
    networks:
      - external
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped

networks:
  # One network per replica, no gateway to the outside: agent-N only reaches edge, and not the
  # other replicas (ADR-0012).
  internal-1:
    internal: true
  internal-2:
    internal: true
  internal-3:
    internal: true
  external: {}

volumes:
  agent-1-data: {}
  agent-2-data: {}
  agent-3-data: {}
  edge-data: {}
