# CI: lint, typecheck, tests and build on every push/PR, plus build of the container
# images for amd64 and arm64 (arm64 on a native runner, no QEMU).
#
# The images are only built, never published: no container registry has been chosen
# yet. Nothing here uses secrets, and pull_request_target is deliberately not used.
name: ci

on:
  push:
    branches:
      - main
      - "ccr-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    name: image ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    needs: check
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        # 2 platforms x 2 images = 4 jobs.
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
        image:
          - { name: agent, dockerfile: docker/Dockerfile }
          - { name: edge, dockerfile: docker/Dockerfile.edge }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only: push is false and no registry is configured yet.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
