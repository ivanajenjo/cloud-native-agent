# Agent Gradle settings. Copied to $GRADLE_USER_HOME/gradle.properties (volume) if it does not exist.
org.gradle.daemon=false
org.gradle.jvmargs=-Xmx1g

# Egress only through edge (ADR-0004).
systemProp.http.proxyHost=edge
systemProp.http.proxyPort=3128
systemProp.https.proxyHost=edge
systemProp.https.proxyPort=3128
systemProp.http.nonProxyHosts=localhost|127.0.0.1|edge
